name: Qtunnel

options:
  bundleIdPrefix: com.karsa.qtunnel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Qtunnel:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: DesignSystem
      - path: Models
      - path: Storage
      - path: Protocol
      - path: Networking
      - path: StateMachine
      - path: UI
      - path: Util
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Qtunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karsa.qtunnel.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  QtunnelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Qtunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karsa.qtunnel.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Qtunnel:
    build:
      targets:
        Qtunnel: all
        QtunnelTests: [test]
    test:
      targets:
        - QtunnelTests
    run:
      config: Debug
    archive:
      config: Release
